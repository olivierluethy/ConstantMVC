<?xml version="1.0" encoding="UTF-8"?>
<!--
  ConstantMVC — original logo.
  An open "C" (the framework) crossed by a horizontal "constant line" — the
  recurring motif of the design: something that stays the same, a single source
  of truth. Self-contained SVG, tuned for dark backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="ConstantMVC logo">
  <defs>
    <linearGradient id="cf-grad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Badge so the mark also works as a standalone favicon. -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="#0B0F17" stroke="#1F2937" stroke-width="1.5"/>

  <!-- The open "C". -->
  <path d="M32.62 12.97 A14 14 0 1 0 32.62 35.03"
        fill="none" stroke="url(#cf-grad)" stroke-width="5" stroke-linecap="round"/>

  <!-- The constant line — steady, horizontal, reaching through the opening. -->
  <line x1="21" y1="24" x2="41" y2="24" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
</svg>
